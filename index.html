    // ==========================================
    // 1. NATIVE CANVAS CELEBRATION PARTICLES
    // ==========================================
    function triggerConfetti() {
      const canvas = document.getElementById('arena-confetti');
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.display = 'block';

      const ctx = canvas.getContext('2d');
      const colors = ['#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899', '#10b981', '#ffffff'];
      const particles = [];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 200,
          y: canvas.height / 2 - 50,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 1) * 18 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = 0;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.45; // gravity
          p.rotation += p.vRot;
          p.opacity -= 0.012;

          if (p.opacity > 0) {
            active++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
            ctx.restore();
          }
        });

        frame++;
        if (active > 0 && frame < 150) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.style.display = 'none';
        }
      }
      requestAnimationFrame(animate);
    }

    // ==========================================
    // 2. SOUND EFFECTS (Web Audio API Synthesizer)
    // ==========================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      setEnabled(val) { this.enabled = !!val; }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch (e) {}
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.05);
            gain.gain.setValueAtTime(0.12, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.22);
          });
        } catch (e) {}
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(130, now + 0.22);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {}
      }
      playTick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.03);
        } catch (e) {}
      }
      playLevelUp() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [440, 554.37, 659.25, 880, 1108.73].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.08, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.25);
          });
        } catch (e) {}
      }
      playVictory() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.1);
            gain.gain.setValueAtTime(0.12, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.35);
          });
        } catch (e) {}
      }
      playPowerUp() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } catch (e) {}
      }
    }

        desc: { uz: 'Futbol, Olimpiada, chempionlar va jahon rekordlari.', ru: 'Футбол, Олимпийские игры, чемпионы и рекорды.', en: 'Athletes, champions, football, basketball, and Olympics.' }
      },
      english: {
        name: { uz: 'Ingliz Tili', ru: 'Английский Язык', en: 'English' },
        desc: { uz: "Grammatika, so'z boyligi, iboralar va adabiyot.", ru: 'Грамматика, словарный запас, идиомы и фразы.', en: 'Grammar, vocabulary, idioms, and literature.' }
      }
    };

    function getCatName(cat, lang = 'uz') {
      if (!cat) return '';
      const id = typeof cat === 'string' ? cat : cat.id;
      if (CAT_I18N[id] && CAT_I18N[id].name) {
        return CAT_I18N[id].name[lang] || CAT_I18N[id].name.uz || CAT_I18N[id].name.en;
      }
      return typeof cat === 'object' && cat.name ? cat.name : id;
    }

    function getCatDesc(cat, lang = 'uz') {
      if (!cat) return '';
      const id = typeof cat === 'string' ? cat : cat.id;
      if (CAT_I18N[id] && CAT_I18N[id].desc) {
        return CAT_I18N[id].desc[lang] || CAT_I18N[id].desc.uz || CAT_I18N[id].desc.en;
      }
      return typeof cat === 'object' && cat.description ? cat.description : '';
    }

    const LEVEL_TITLES_I18N = {
      uz: ["SHOGIRD OLIM", "ARENA YANGISI", "BILIM JANGCHISI", "BILIMDON RITSAR", "AQL UMRONI", "ARENA VETERANI", "DONO GLADIATOR", "YUKSAK GROSSMEYSTER", "YENGILMAS SARKARDA", "ARENA AFSONASI"],
      ru: ["УЧЕНИК МУДРЕЦА", "НОВИЧОК АРЕНЫ", "ВОИН ЗНАНИЙ", "РЫЦАРЬ ЭРУДИЦИИ", "МАСТЕР РАЗУМА", "ВЕТЕРАН АРЕНЫ", "ГЛАДИАТОР ЗНАНИЙ", "ВЫСШИЙ ГРОССМЕЙСТЕР", "НЕПОБЕДИМЫЙ ПОЛКОВОДЕЦ", "ЛЕГЕНДА АРЕНЫ"],
      en: ["APPRENTICE SCHOLAR", "ARENA NOVICE", "KNOWLEDGE WARRIOR", "SCHOLAR KNIGHT", "MIND MASTER", "ARENA VETERAN", "GLADIATOR SAGE", "GRANDMASTER", "INVINCIBLE CHAMPION", "ARENA LEGEND"]
    };

    function getLevelTitle(level, lang = 'uz') {
      const list = LEVEL_TITLES_I18N[lang] || LEVEL_TITLES_I18N.uz;
      return list[Math.min(Math.max(0, level - 1), list.length - 1)] || list[0];
    }

    function getTxt(item, lang = 'uz') {
      if (!item) return '';
      if (typeof item === 'string') return item;
      return item[lang] || item['uz'] || item['en'] || Object.values(item)[0] || '';
    }

    function App() {
      const [lang, setLang] = useState(() => {
        try {
          return localStorage.getItem('quiz_arena_lang') || 'uz';
        } catch (e) {
          return 'uz';
        }
      });
      const t = TRANSLATIONS[lang] || TRANSLATIONS.uz;

      useEffect(() => {
        try {
          localStorage.setItem('quiz_arena_lang', lang);
        } catch (e) {}
      }, [lang]);

      const STORAGE_KEY = 'quiz_arena_local_v3';
      const DEFAULT_USER = {
        username: 'GladiatorOne',
        avatar: '🥷',
        level: 2,
        xp: 260,
        points: 620,
        gamesPlayed: 3,
        correctAnswers: 12,
        totalAnswersAttempted: 15,
        multiplayerWins: 1,
        perfectScores: 1,
        fastAnswers: 4,
        categoriesPlayed: ['general', 'technology'],
        dailyCompleted: 0,
        loginStreak: 2,
        lastDailyClaim: null,
        isLoggedIn: true
      };

      const [user, setUser] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY);
          if (s) return JSON.parse(s);
        } catch (e) {}
        return DEFAULT_USER;
      });

      const [currentScreen, setCurrentScreen] = useState('home');
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [activeGameConfig, setActiveGameConfig] = useState(null);
      const [lastResultsData, setLastResultsData] = useState(null);
      const [activeRoomData, setActiveRoomData] = useState(null);

      const [isDailyRewardOpen, setIsDailyRewardOpen] = useState(false);
      const [levelUpModalData, setLevelUpModalData] = useState({ visible: false, level: 1 });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
        } catch (e) {}
      }, [user]);

      const toggleSound = () => {
        const next = !soundEnabled;
        setSoundEnabled(next);
        sound.setEnabled(next);
        if (next) sound.playClick();
      };

      const handleLogin = ({ username, avatar }) => {
        setUser(prev => ({ ...prev, username, avatar, isLoggedIn: true }));
        setCurrentScreen('home');
      };

      const handleStartQuiz = (config) => {
        setActiveGameConfig(config);
        setCurrentScreen('quiz');
      };

      const handleFinishGame = ({ userScore, opponentScore, totalQuestions, answersLog, gameConfig, opponent }) => {
        const correctCount = answersLog.filter(a => a.isCorrect).length;
        const fastCount = answersLog.filter(a => a.isCorrect && a.timeTaken < 10).length;
        const isPerfect = correctCount === totalQuestions;
        const isWinner = opponent ? userScore > opponentScore : correctCount >= 4;

        if (isWinner || isPerfect) {
          triggerConfetti();
        }

        const gainedXp = Math.round((userScore / 10) + (correctCount * 15));
        const nextXp = user.xp + gainedXp;
        const nextLevel = Math.max(1, Math.floor(nextXp / 200) + 1);

        if (nextLevel > user.level) {
          sound.playLevelUp();
          triggerConfetti();
          setLevelUpModalData({ visible: true, level: nextLevel });
        } else {
          if (isWinner) sound.playVictory();
        }

        const catSet = new Set(user.categoriesPlayed || []);
        if (gameConfig.category) catSet.add(gameConfig.category);

        setUser(prev => ({
          ...prev,
          xp: nextXp,
          level: nextLevel,
          points: prev.points + userScore,
          gamesPlayed: prev.gamesPlayed + 1,
          correctAnswers: prev.correctAnswers + correctCount,
          totalAnswersAttempted: prev.totalAnswersAttempted + totalQuestions,
          fastAnswers: (prev.fastAnswers || 0) + fastCount,
          perfectScores: (prev.perfectScores || 0) + (isPerfect ? 1 : 0),
          multiplayerWins: (prev.multiplayerWins || 0) + (opponent && isWinner ? 1 : 0),
          dailyCompleted: (prev.dailyCompleted || 0) + (gameConfig.mode === 'daily' ? 1 : 0),
          categoriesPlayed: Array.from(catSet)
        }));

        setLastResultsData({
          userScore,
          opponentScore,
          totalQuestions,
          answersLog,
          gameConfig,
          opponent
        });

        setCurrentScreen('results');
      };

      const handleClaimDaily = () => {
        const todayStr = new Date().toDateString();
        const streak = user.loginStreak || 1;
        const rewards = [
          { pts: 100, xp: 50 }, { pts: 150, xp: 75 }, { pts: 200, xp: 100 },
          { pts: 300, xp: 150 }, { pts: 400, xp: 200 }, { pts: 500, xp: 250 }, { pts: 1000, xp: 500 }
        ];
        const r = rewards[(streak - 1) % 7] || rewards[0];
        const nextXp = user.xp + r.xp;
        const nextLevel = Math.max(1, Math.floor(nextXp / 200) + 1);

        triggerConfetti();
        if (nextLevel > user.level) {
          setLevelUpModalData({ visible: true, level: nextLevel });
        }

        setUser(prev => ({
          ...prev,
          points: prev.points + r.pts,
          xp: nextXp,
          level: nextLevel,
          loginStreak: prev.loginStreak + 1,
          lastDailyClaim: todayStr
        }));

        setTimeout(() => setIsDailyRewardOpen(false), 800);
      };

      const handleResetData = () => {
        localStorage.removeItem(STORAGE_KEY);
        setUser({
          ...DEFAULT_USER,
          username: 'NewGladiator',
          points: 0,
          xp: 0,
          level: 1,
          gamesPlayed: 0,
          correctAnswers: 0,
          totalAnswersAttempted: 0,
          multiplayerWins: 0,
          fastAnswers: 0,
          perfectScores: 0,
          categoriesPlayed: [],
          dailyCompleted: 0
        });
        setCurrentScreen('home');
      };

      const todayStr = new Date().toDateString();
      const dailyClaimedToday = user.lastDailyClaim === todayStr;

      // Header progression stats
      const currentLvlXp = (user.level - 1) * 200;
      const progressInLevel = Math.max(0, user.xp - currentLvlXp);
      const xpPercent = Math.min(100, Math.round((progressInLevel / 200) * 100));

      const showNavbar = !['welcome', 'quiz', 'multiplayer_lobby'].includes(currentScreen);
      const showHeader = !['welcome', 'quiz'].includes(currentScreen);

      return (
        <SafeAreaView className="min-h-screen bg-[#070913] text-slate-100 flex flex-col font-sans">
          {/* HEADER */}
          {showHeader && (
            <header className="sticky top-0 z-40 w-full border-b border-slate-800/80 bg-[#0a0e1c]/90 backdrop-blur-md px-4 py-3 sm:px-6">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <TouchableOpacity onPress={() => { sound.playClick(); setCurrentScreen('home'); }} className="flex items-center space-x-3 group">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-400 p-0.5 shadow-lg shadow-purple-600/30 group-hover:scale-105 transition-transform flex items-center justify-center">
                    <div className="w-full h-full bg-[#0a0e1c] rounded-[10px] flex items-center justify-center text-xl">
                      ⚡
                    </div>
                  </div>
                  <div className="flex flex-col">
                    <div className="flex items-center space-x-1.5">
                      <span className="text-lg font-black tracking-wider bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">QUIZ</span>
                      <span className="text-lg font-black tracking-wider text-white">ARENA</span>
                    </div>
                    <span className="text-[10px] uppercase font-bold tracking-widest text-cyan-400">Battle of Wits</span>
                  </div>
                </TouchableOpacity>

                <div className="flex items-center space-x-3 sm:space-x-5">
                  {/* 3-LANGUAGE BUTTONS (UZ | RU | EN) */}
                  <div className="flex items-center bg-slate-900/90 border border-slate-800 rounded-xl p-1 space-x-1 shadow-inner">
                    {[
                      { code: 'uz', flag: '🇺🇿', label: 'UZ' },
                      { code: 'ru', flag: '🇷🇺', label: 'RU' },
                      { code: 'en', flag: '🇬🇧', label: 'EN' }
                    ].map(l => (
                      <button
                        key={l.code}
                        type="button"
                        onClick={() => { sound.playClick(); setLang(l.code); }}
                        className={`px-2 py-1 rounded-lg text-xs font-bold transition-all flex items-center space-x-1 ${lang === l.code ? 'bg-cyan-500 text-slate-950 shadow-md shadow-cyan-500/30' : 'text-slate-400 hover:text-white'}`}
                        title={l.label}
                      >
                        <span className="text-xs">{l.flag}</span>
                        <span className="font-mono text-[11px]">{l.label}</span>
                      </button>
                    ))}
                  </div>

                  <div className="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-900/90 border border-amber-500/30">
                    <span className="text-amber-400 text-sm">🪙</span>
                    <span className="text-xs font-bold text-amber-300 font-mono">{user.points.toLocaleString()} PTS</span>
                  </div>

                  <div onClick={() => { sound.playClick(); setCurrentScreen('profile'); }} className="flex items-center space-x-2.5 px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-purple-500/50 cursor-pointer">
                    <div className="relative">
                      <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center text-base">
                        {user.avatar || '🥷'}
                      </div>
                      <div className="absolute -bottom-1 -right-1 bg-cyan-500 text-slate-950 font-black text-[9px] px-1 rounded font-mono">
                        L{user.level}
                      </div>
                    </div>
                    <div className="hidden md:flex flex-col w-20">
                      <div className="flex justify-between items-center text-[10px] mb-0.5">
                        <span className="font-semibold text-slate-300 truncate max-w-[50px]">{user.username}</span>
                        <span className="text-cyan-400 font-mono">{xpPercent}%</span>
                      </div>
                      <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                        <div className="bg-gradient-to-r from-purple-500 to-cyan-400 h-full transition-all duration-500" style={{ width: `${xpPercent}%` }} />
                      </div>
                    </div>
                  </div>

                  <button type="button" onClick={toggleSound} title={soundEnabled ? 'Mute Sounds' : 'Unmute Sounds'} className="p-2 rounded-xl bg-slate-900/80 border border-slate-800 hover:border-cyan-500/50 text-slate-300 hover:text-cyan-400">
                    {soundEnabled ? (
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>
                    ) : (
                      <svg className="w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>
                    )}
                  </button>

                  <button type="button" onClick={() => { sound.playClick(); setCurrentScreen('settings'); }} title="Settings" className={`p-2 rounded-xl border ${currentScreen === 'settings' ? 'bg-purple-600/30 border-purple-500 text-purple-300' : 'bg-slate-900/80 border-slate-800 text-slate-300 hover:text-white'}`}>
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </button>
                </div>
              </div>
            </header>
          )}

          {/* MAIN SCREENS ROUTER */}
          <main className="flex-1 w-full flex flex-col">
            {currentScreen === 'welcome' && (
              <WelcomeView onLogin={handleLogin} initialUsername={user.username} lang={lang} setLang={setLang} t={t} />
            )}

            {currentScreen === 'home' && (
              <HomeView
                user={user}
                onNavigate={setCurrentScreen}
                onStartQuiz={handleStartQuiz}
                onOpenDailyReward={() => setIsDailyRewardOpen(true)}
                dailyClaimedToday={dailyClaimedToday}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'categories' && (
              <CategoriesView
                onStartQuiz={handleStartQuiz}
                onBack={() => setCurrentScreen('home')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'game_modes' && (
              <GameModesView
                onNavigate={setCurrentScreen}
                onStartQuiz={handleStartQuiz}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'quiz' && activeGameConfig && (
              <QuizGameplayView
                gameConfig={activeGameConfig}
                user={user}
                onFinishGame={handleFinishGame}
                onQuit={() => setCurrentScreen('home')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'multiplayer_lobby' && activeRoomData && (
              <MultiplayerLobbyView
                roomData={activeRoomData}
                user={user}
                onStartBattle={(cfg) => { setActiveGameConfig(cfg); setCurrentScreen('quiz'); }}
                onLeaveLobby={() => setCurrentScreen('room_creation')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'room_creation' && (
              <RoomCreationView
                user={user}
                onEnterLobby={(data) => { setActiveRoomData(data); setCurrentScreen('multiplayer_lobby'); }}
                onBack={() => setCurrentScreen('game_modes')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'leaderboard' && (
              <LeaderboardView user={user} lang={lang} setLang={setLang} t={t} />
            )}

            {currentScreen === 'profile' && (
              <ProfileView
                user={user}
                onUpdateProfile={(updated) => setUser(p => ({ ...p, ...updated }))}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'results' && lastResultsData && (
              <ResultsView
                resultsData={lastResultsData}
                user={user}
                onPlayAgain={(cfg) => handleStartQuiz(cfg)}
                onGoHome={() => setCurrentScreen('home')}
                onViewLeaderboard={() => setCurrentScreen('leaderboard')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}

            {currentScreen === 'settings' && (
              <SettingsView
                soundEnabled={soundEnabled}
                onToggleSound={toggleSound}
                onResetData={handleResetData}
                onBack={() => setCurrentScreen('home')}
                lang={lang}
                setLang={setLang}
                t={t}
              />
            )}
          </main>

          {/* DOCK NAVBAR */}
          {showNavbar && (
            <NavbarView currentScreen={currentScreen} onNavigate={setCurrentScreen} t={t} />
          )}

          {/* MODALS */}
          <DailyRewardModal
            visible={isDailyRewardOpen}
            streak={user.loginStreak || 1}
            claimedToday={dailyClaimedToday}
            onClose={() => setIsDailyRewardOpen(false)}
            onClaim={handleClaimDaily}
            lang={lang}
            t={t}
          />

          <LevelUpModal
            visible={levelUpModalData.visible}
            level={levelUpModalData.level}
            onClose={() => setLevelUpModalData({ visible: false, level: 1 })}
            lang={lang}
            t={t}
          />
        </SafeAreaView>
      );
    }

    // ==========================================
    // SCREEN 1: WELCOME SCREEN
    // ==========================================
    function WelcomeView({ onLogin, initialUsername, lang, setLang, t }) {
      const [name, setName] = useState(initialUsername || 'CyberWarrior');
      const [avatar, setAvatar] = useState('🥷');
      const [err, setErr] = useState('');

      const handleSubmit = () => {
        if (!name.trim()) { setErr('Enter a gladiator codename!'); return; }
        sound.playVictory();
        triggerConfetti();
        onLogin({ username: name.trim(), avatar });
      };

      return (
        <SafeAreaView className="justify-center items-center px-4 py-8 relative overflow-hidden bg-[#070913]">
          <div className="w-full max-w-md z-10 flex flex-col items-center">
            <div className="w-20 h-20 rounded-3xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-cyan-400 p-1 shadow-2xl shadow-purple-600/40 animate-pulse mb-3 flex items-center justify-center">
              <span className="text-4xl">⚡</span>
            </div>
            <h1 className="text-4xl sm:text-5xl font-black text-center">
              <span className="bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400 bg-clip-text text-transparent">QUIZ</span>{' '}
              <span className="text-white">ARENA</span>
            </h1>
            <p className="text-xs font-bold uppercase tracking-widest text-cyan-400 mt-2 mb-6">Competitive Knowledge Platform</p>

            <div className="w-full p-6 sm:p-8 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl">
              <h2 className="text-xl font-bold text-white text-center mb-1">Create Gladiator Identity</h2>
              <p className="text-xs text-slate-400 text-center mb-6">Choose your codename & warrior avatar</p>

              <div className="mb-4">
                <label className="block text-xs font-bold uppercase text-slate-300 mb-1.5">Warrior Codename</label>
                <TextInput value={name} onChangeText={(t) => { setName(t); setErr(''); }} placeholder="Enter name..." className="w-full" />
                {err && <span className="text-rose-400 text-xs font-semibold mt-1 block">{err}</span>}
              </div>

              <div className="mb-6">
                <label className="block text-xs font-bold uppercase text-slate-300 mb-2">Select Avatar</label>
                <div className="grid grid-cols-6 gap-2">
                  {AVATARS.map(av => (
                    <button key={av.id} type="button" onClick={() => { sound.playClick(); setAvatar(av.icon); }} className={`h-12 rounded-xl flex items-center justify-center text-2xl transition-all ${avatar === av.icon ? 'bg-gradient-to-br from-purple-600 to-cyan-500 scale-105 ring-2 ring-cyan-300' : 'bg-slate-800 border border-slate-700'}`}>
                      {av.icon}
                    </button>
                  ))}
                </div>
              </div>

              <TouchableOpacity onPress={handleSubmit} className="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 text-white font-black tracking-wider uppercase shadow-xl shadow-purple-600/30 text-center flex items-center justify-center space-x-2">
                <span>ENTER THE ARENA</span>
                <span>➔</span>
              </TouchableOpacity>
            </div>
          </div>
        </SafeAreaView>
      );
    }

    // ==========================================
    // SCREEN 2: HOME DASHBOARD
    // ==========================================
    function HomeView({ user, onNavigate, onStartQuiz, onOpenDailyReward, dailyClaimedToday, lang = 'uz', setLang, t = {} }) {
      const currentLvlXp = (user.level - 1) * 200;
      const progressInLevel = Math.max(0, user.xp - currentLvlXp);
      const xpPercent = Math.min(100, Math.round((progressInLevel / 200) * 100));
      const title = getLevelTitle(user.level, lang);
      const accuracy = user.totalAnswersAttempted > 0 ? Math.round((user.correctAnswers / user.totalAnswersAttempted) * 100) : 0;

      return (
        <div className="pb-24 pt-4 px-4 sm:px-6 max-w-7xl mx-auto w-full animate-fade-in">
          {/* Gladiator Profile Hero */}
          <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-900/40 via-indigo-950/60 to-slate-900 border border-purple-500/30 p-6 sm:p-8 shadow-2xl mb-8">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6">

    function QuizGameplayView({ gameConfig, user, onFinishGame, onQuit, lang = "uz", t = {} }) {
      const { mode = 'single', category = 'general', difficulty = 'medium', opponent = null, title = 'Arena Quiz' } = gameConfig;

      const questionsList = useMemo(() => {
        if (mode === 'daily') return [...DAILY_QUESTIONS];
        const catQ = (QUESTIONS_BANK[category] && QUESTIONS_BANK[category][difficulty]) || QUESTIONS_BANK.general.medium;
        return [...catQ].slice(0, 5);
      }, [mode, category, difficulty]);

      const [index, setIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [timer, setTimer] = useState(30);
      const [userScore, setUserScore] = useState(0);
      const [opponentScore, setOpponentScore] = useState(0);
      const [opponentState, setOpponentState] = useState('thinking');
      const [streak, setStreak] = useState(0);
      const [log, setLog] = useState([]);

      // Lifelines state
      const [lifelines, setLifelines] = useState({ fiftyFifty: true, timeFreeze: true, hint: true });
      const [hiddenOptions, setHiddenOptions] = useState([]);
      const [activeHint, setActiveHint] = useState(null);

      const timerRef = useRef(null);
      const nextRef = useRef(null);

      const currentQ = questionsList[index] || { question: '', options: [], correctIndex: 0, explanation: '', hint: '' };
      const isPractice = mode === 'practice';
      const total = questionsList.length;

      // Timer Effect
      useEffect(() => {
        if (isPractice || answered) return;

        setTimer(30);
        setOpponentState('thinking');
        setHiddenOptions([]);
        setActiveHint(null);

        let oppTimer = null;
        if (opponent) {
          const delay = Math.floor(Math.random() * 6000) + 4000;
          oppTimer = setTimeout(() => {
            setOpponentState('answered');
            if (Math.random() < 0.75) {
              setOpponentScore(prev => prev + 120);
            }
          }, delay);
        }

        timerRef.current = setInterval(() => {
          setTimer(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleTimeout();
              return 0;
            }
            if (prev <= 6) sound.playTick();
            return prev - 1;
          });
        }, 1000);

        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
          if (oppTimer) clearTimeout(oppTimer);
          if (nextRef.current) clearTimeout(nextRef.current);
        };
      }, [index, answered, isPractice, opponent]);

      // Keyboard Controls (1-4, A-D, Enter, Space)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (answered) {
            if (e.key === 'Enter' || e.key === ' ') {
              advance();
            }
            return;
          }

          const key = e.key.toUpperCase();
          if (key === 'A' || key === '1') handleChoose(0);
          else if (key === 'B' || key === '2') handleChoose(1);
          else if (key === 'C' || key === '3') handleChoose(2);
          else if (key === 'D' || key === '4') handleChoose(3);
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [answered, index, hiddenOptions]);

      const handleTimeout = () => {
        if (answered) return;
        sound.playWrong();
        setAnswered(true);
        setSelected(-1);
        setStreak(0);
        setLog(prev => [...prev, { question: getTxt(currentQ.question, lang), selected: -1, correct: currentQ.correctIndex, isCorrect: false, timeTaken: 30, pointsAwarded: 0 }]);
        nextRef.current = setTimeout(advance, 2200);
      };

      const handleChoose = (idx) => {
        if (answered || hiddenOptions.includes(idx)) return;
        if (timerRef.current) clearInterval(timerRef.current);
        setAnswered(true);
        setSelected(idx);

        const isCorrect = idx === currentQ.correctIndex;
        const timeUsed = 30 - timer;
        let pts = 0;

        if (isCorrect) {
          sound.playCorrect();
          const nextStreak = streak + 1;
          setStreak(nextStreak);
          const speed = isPractice ? 0 : timer * 2;
          const streakBonus = nextStreak > 1 ? (nextStreak - 1) * 20 : 0;
          const mult = difficulty === 'hard' ? 2 : difficulty === 'medium' ? 1.5 : 1;
          pts = Math.round((100 + speed + streakBonus) * mult);
          setUserScore(prev => prev + pts);
        } else {
          sound.playWrong();
          setStreak(0);
        }

        setLog(prev => [...prev, { question: getTxt(currentQ.question, lang), selected: idx, correct: currentQ.correctIndex, isCorrect, timeTaken: timeUsed, pointsAwarded: pts }]);
        nextRef.current = setTimeout(advance, 2200);
      };

      const advance = () => {
        if (nextRef.current) clearTimeout(nextRef.current);
        if (index + 1 < total) {
          setIndex(prev => prev + 1);
          setSelected(null);
          setAnswered(false);
          setTimer(30);
          setHiddenOptions([]);
          setActiveHint(null);
        } else {
          onFinishGame({ userScore, opponentScore, totalQuestions: total, answersLog: log, gameConfig, opponent });
        }
      };

      // Lifelines implementations
      const useFiftyFifty = () => {
        if (!lifelines.fiftyFifty || answered) return;
        sound.playPowerUp();
        setLifelines(prev => ({ ...prev, fiftyFifty: false }));
        const wrongIndices = [0, 1, 2, 3].filter(i => i !== currentQ.correctIndex);
        const shuffledWrong = wrongIndices.sort(() => 0.5 - Math.random());
        setHiddenOptions(shuffledWrong.slice(0, 2));
      };

      const useTimeFreeze = () => {
        if (!lifelines.timeFreeze || answered || isPractice) return;
        sound.playPowerUp();
        setLifelines(prev => ({ ...prev, timeFreeze: false }));
        setTimer(prev => prev + 15);
      };

      const useHint = () => {
        if (!lifelines.hint || answered) return;
        sound.playPowerUp();
        setLifelines(prev => ({ ...prev, hint: false }));
        setActiveHint(currentQ.hint || 'Carefully re-read the keywords in the query!');
      };

      const timerColor = timer <= 5 ? '#f43f5e' : timer <= 10 ? '#f59e0b' : '#06b6d4';

      return (
        <SafeAreaView className="min-h-screen px-4 py-4 sm:px-6 max-w-4xl mx-auto w-full justify-between pb-8">
          <div>
            <div className="flex items-center justify-between mb-4">
              <button type="button" onClick={() => { sound.playClick(); if (window.confirm('Quit this quiz?')) onQuit(); }} className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-400 hover:text-white">
                {t.quitBtn || "✕ Quit"}
              </button>
              <div className="flex items-center space-x-2">
                <span className="px-3 py-1 rounded-full text-xs font-black uppercase bg-purple-500/20 text-purple-300 border border-purple-500/30">{title}</span>
                <span className="text-xs font-mono font-bold text-slate-400">Q {index + 1} / {total}</span>
              </div>
              <div className="flex items-center space-x-2 font-mono font-black text-amber-300 text-sm bg-slate-900 px-3 py-1.5 rounded-xl border border-amber-500/30">
                <span>🪙</span>
                <span>{userScore} PTS</span>
              </div>
            </div>

            {/* Live Opponent Status HUD */}
            {opponent && (
              <div className="mb-4 p-3 rounded-2xl bg-slate-900/90 border border-cyan-500/30 flex items-center justify-between shadow-lg">
                <div className="flex items-center space-x-2.5">
                  <div className="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-base">{user.avatar}</div>
                  <div>
                    <span className="text-xs font-black text-white block">{user.username} (You)</span>
                    <span className="text-[11px] font-mono text-cyan-300 font-bold">{userScore} PTS</span>
                  </div>
                </div>
                <span className="px-2.5 py-0.5 rounded-full bg-slate-800 text-xs font-black text-slate-400">VS</span>
                <div className="flex items-center space-x-2.5 text-right">
                  <div>
                    <span className="text-xs font-black text-white block">{opponent.name} {opponentState === 'thinking' ? '⏳' : '✓'}</span>
                    <span className="text-[11px] font-mono text-amber-400 font-bold">{opponentScore} PTS</span>
                  </div>
                  <div className="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center text-base">{opponent.avatar}</div>
                </div>
              </div>
            )}

            {/* Round Bar */}
            <div className="w-full bg-slate-800/80 h-1.5 rounded-full overflow-hidden mb-4">
              <div className="bg-gradient-to-r from-purple-500 via-indigo-400 to-cyan-400 h-full transition-all duration-300" style={{ width: `${((index + 1) / total) * 100}%` }} />
            </div>

            {/* Timer & Arena Lifelines Controls */}
            <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
              <div className="flex items-center space-x-2">
                {streak > 1 ? (
                  <span className="px-3 py-1 rounded-full text-xs font-black uppercase bg-orange-500/20 text-orange-400 border border-orange-500/40 animate-pulse">
                    🔥 {streak}x Combo Streak!
                  </span>
                ) : (
                  <span className="text-xs text-slate-500">Standard Multiplier</span>
                )}
              </div>

              {/* In-Game Lifelines (Power-Ups) */}
              <div className="flex items-center space-x-2">
                <button
                  type="button"
                  disabled={!lifelines.fiftyFifty || answered}
                  onClick={useFiftyFifty}
                  title="50:50 (Eliminate 2 wrong answers)"
                  className={`px-2.5 py-1 rounded-lg text-xs font-black border transition-all ${
                    lifelines.fiftyFifty && !answered
                      ? 'bg-purple-950/80 border-purple-500 text-purple-300 hover:scale-105 active:scale-95'
                      : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  ⚡ 50:50
                </button>

                {!isPractice && (
                  <button
                    type="button"
                    disabled={!lifelines.timeFreeze || answered}
                    onClick={useTimeFreeze}
                    title="Time Freeze (+15s timer boost)"
                    className={`px-2.5 py-1 rounded-lg text-xs font-black border transition-all ${
                      lifelines.timeFreeze && !answered
                        ? 'bg-cyan-950/80 border-cyan-500 text-cyan-300 hover:scale-105 active:scale-95'
                        : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'
                    }`}
                  >
                    ⏱️ {t.lifelineFreeze || "+15s"}
                  </button>
                )}

                <button
                  type="button"
                  disabled={!lifelines.hint || answered}
                  onClick={useHint}
                  title="Hint / Clue"
                  className={`px-2.5 py-1 rounded-lg text-xs font-black border transition-all ${
                    lifelines.hint && !answered
                      ? 'bg-amber-950/80 border-amber-500 text-amber-300 hover:scale-105 active:scale-95'
                      : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  💡 {t.lifelineHint || "Hint"}
                </button>
              </div>

              {!isPractice && (
                <div className="flex items-center space-x-2">
                  <div className="w-10 h-10 rounded-full border-2 flex items-center justify-center font-mono font-black text-xs" style={{ borderColor: timerColor, color: timerColor }}>
                    {timer}
                  </div>
                  <span className="text-xs font-bold text-slate-400">sec</span>
                </div>
              )}
            </div>

            {/* Active Hint Banner */}
            {activeHint && (
              <div className="mb-3 p-3 rounded-2xl bg-amber-950/60 border border-amber-500/40 text-xs text-amber-200 flex items-center space-x-2 animate-fade-in">
                <span>💡</span>
                <span><strong>Tactical Clue:</strong> {activeHint}</span>
              </div>
            )}
          </div>

          {/* Question Card */}
          <div className="p-6 sm:p-8 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl my-2">
            <span className="text-[11px] font-bold uppercase tracking-widest text-cyan-400 block mb-2">{(t.categoriesHeader || "Category")}: {getCatName(category, lang).toUpperCase()}</span>
            <h2 className="text-xl sm:text-2xl font-black text-white leading-relaxed min-h-[64px] flex items-center">{getTxt(currentQ.question, lang)}</h2>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mt-8">
              {((Array.isArray(currentQ.options) ? currentQ.options : (currentQ.options && (currentQ.options[lang] || currentQ.options.uz || currentQ.options.en))) || []).map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                const isCorrect = idx === currentQ.correctIndex;
                const isSel = selected === idx;
                const isHidden = hiddenOptions.includes(idx);

                let btnClass = 'bg-slate-800/80 border-slate-700/80 text-white hover:border-cyan-500/60';
                let badgeClass = 'bg-slate-700 text-slate-300';

                if (isHidden) {
                  btnClass = 'opacity-20 border-slate-800 pointer-events-none';
                }

                if (answered) {
                  if (isCorrect) {
                    btnClass = 'bg-emerald-950/90 border-emerald-400 text-emerald-100 ring-2 ring-emerald-400/50 shadow-lg';
                    badgeClass = 'bg-emerald-500 text-slate-950 font-black';
                  } else if (isSel && !isCorrect) {
                    btnClass = 'bg-rose-950/90 border-rose-500 text-rose-100 ring-2 ring-rose-500/50 shadow-lg';
                    badgeClass = 'bg-rose-500 text-white font-black';
                  } else {
                    btnClass = 'bg-slate-900/40 border-slate-800/60 text-slate-500 opacity-60';
                  }
                }

                return (
                  <button
                    key={idx}
                    type="button"
                    disabled={answered || isHidden}
                    onClick={() => handleChoose(idx)}
                    className={`flex items-center p-4 rounded-2xl border text-left font-bold transition-all duration-200 active:scale-98 relative ${btnClass}`}
                  >
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-black mr-3 flex-shrink-0 ${badgeClass}`}>
                      {answered && isCorrect ? '✓' : answered && isSel && !isCorrect ? '✕' : letter}
                    </div>
                    <span className="text-sm sm:text-base leading-snug flex-1">{opt}</span>
                    <span className="hidden sm:inline-block text-[10px] text-slate-500 font-mono font-bold ml-2">[{letter}]</span>
                  </button>
                );
              })}
            </div>

            {answered && (
              <div className="mt-6 p-4 rounded-2xl bg-slate-950/80 border border-slate-800 animate-fade-in flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                  <span className={`text-xs font-black uppercase ${selected === currentQ.correctIndex ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {selected === currentQ.correctIndex ? '★ Correct Answer!' : '✕ Incorrect'}
                  </span>
                  <p className="text-xs text-slate-300 mt-1">{currentQ.explanation}</p>
                </div>
                <button type="button" onClick={advance} className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold text-xs uppercase shadow-md flex-shrink-0 self-end sm:self-center">
                  Next ➔ [Enter]
                </button>
              </div>
            )}
          </div>

          <div className="text-center text-xs text-slate-500 font-medium">
            Keyboard shortcuts: Press [1, 2, 3, 4] or [A, B, C, D] to answer immediately
          </div>
        </SafeAreaView>
      );
    }

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div className="p-6 rounded-3xl bg-slate-900/80 border border-purple-500/40 shadow-xl">
              <span className="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-purple-500/20 text-purple-300 border border-purple-500/30">Host</span>
              <div className="flex items-center space-x-4 my-4">

                        <span className="text-base block">{c.icon}</span>
                        <span className="text-xs font-bold block truncate">{c.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mb-6">
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-2">Difficulty</label>

    function ResultsView({ resultsData, user, onPlayAgain, onGoHome, onViewLeaderboard, lang = "uz", t = {} }) {
      const { userScore = 0, opponentScore = 0, totalQuestions = 5, answersLog = [], gameConfig = {}, opponent = null } = resultsData;
      const isMultiplayer = !!opponent;
      const correctCount = answersLog.filter(a => a.isCorrect).length;
      const accuracy = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
      const isWinner = isMultiplayer ? userScore > opponentScore : accuracy >= 80;
      const isDraw = isMultiplayer && userScore === opponentScore;
      const xpEarned = Math.round((userScore / 10) + (correctCount * 15));

      return (
        <div className="pb-24 pt-4 px-4 sm:px-6 max-w-4xl mx-auto w-full animate-fade-in">
          <div className="p-8 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl text-center mb-8">
            <span className="text-5xl block mb-2">{isMultiplayer ? (isWinner ? '🏆' : isDraw ? '🤝' : '⚔️') : (accuracy === 100 ? '👑' : '⭐')}</span>
            <span className={`inline-block px-3 py-1 rounded-full text-xs font-black uppercase tracking-widest border mb-2 ${isWinner ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : isDraw ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-rose-500/20 text-rose-300 border-rose-500/40'}`}>
              {isMultiplayer ? (isWinner ? 'Victory' : isDraw ? 'Draw' : 'Defeat') : (accuracy === 100 ? 'Flawless Victory' : 'Quiz Complete')}
            </span>
            <h2 className="text-3xl font-black text-white">{isMultiplayer ? (isWinner ? `You Defeated ${opponent.name}!` : isDraw ? 'Honorable Tie' : `${opponent.name} Won!`) : 'Game Over!'}</h2>

            {isMultiplayer ? (
              <div className="grid grid-cols-2 gap-4 max-w-sm mx-auto my-6 p-4 rounded-2xl bg-slate-950/80 border border-slate-800">
                <div className="p-3 rounded-xl bg-slate-900 border border-purple-500/30">
                  <span className="text-2xl block">{user.avatar}</span>
                  <span className="text-xs font-bold text-white block">{user.username}</span>
                  <span className="text-2xl font-black text-cyan-300 font-mono mt-1 block">{userScore}</span>
                </div>
                <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <span className="text-2xl block">{opponent.avatar}</span>
                  <span className="text-xs font-bold text-white block">{opponent.name}</span>
                  <span className="text-2xl font-black text-amber-300 font-mono mt-1 block">{opponentScore}</span>
                </div>
              </div>
            ) : (
              <div className="my-6 inline-block py-3 px-8 rounded-2xl bg-slate-950/80 border border-amber-500/40">
                <span className="text-xs font-bold text-slate-400 uppercase block">Score</span>
                <span className="text-4xl font-black text-amber-300 font-mono">{userScore} PTS</span>
              </div>
            )}

            <div className="grid grid-cols-3 gap-3 max-w-md mx-auto pt-4 border-t border-slate-800 text-center">
              <div><span className="text-xs text-slate-400 block">Correct</span><span className="text-lg font-black text-emerald-400 font-mono">{correctCount} / {totalQuestions}</span></div>
              <div><span className="text-xs text-slate-400 block">Accuracy</span><span className="text-lg font-black text-cyan-300 font-mono">{accuracy}%</span></div>
              <div><span className="text-xs text-slate-400 block">XP Gained</span><span className="text-lg font-black text-purple-400 font-mono">+{xpEarned} XP</span></div>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">
            <TouchableOpacity onPress={() => { sound.playClick(); onPlayAgain(gameConfig); }} className="py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-black text-xs uppercase text-center shadow-lg">
              Play Again 🔄
            </TouchableOpacity>
            <TouchableOpacity onPress={() => { sound.playClick(); onViewLeaderboard(); }} className="py-3.5 rounded-2xl bg-slate-900 border border-cyan-500/40 text-cyan-400 font-bold text-xs uppercase text-center">
              Leaderboard 🏆
            </TouchableOpacity>
            <TouchableOpacity onPress={() => { sound.playClick(); onGoHome(); }} className="py-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-300 font-bold text-xs uppercase text-center">
              Return Home 🏠
            </TouchableOpacity>
          </div>

          <h3 className="text-xl font-black text-white mb-4">Question Recap</h3>
          <div className="space-y-3">
            {answersLog.map((item, idx) => (
              <div key={idx} className="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 flex items-center justify-between">
                <div>
                  <span className={`text-xs font-bold ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>{item.isCorrect ? '✓ Correct' : '✕ Missed'} (+{item.pointsAwarded} pts)</span>

        </div>
      );

              <div>
                <h3 className="text-base font-bold text-rose-400">Reset Local Profile</h3>
                <p className="text-xs text-slate-400">Reset career score, levels, and statistics</p>
              </div>
              <button type="button" onClick={() => setConfirm(true)} className="px-4 py-2 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-400 text-xs font-bold">
                Reset
              </button>
            </div>

            <div className="p-6 rounded-3xl bg-slate-900/40 border border-slate-800 text-center text-xs text-slate-400">
              <strong className="text-white block text-sm mb-1">⚡ QUIZ ARENA v2.5</strong>
              Pure HTML • Tailwind CSS • React Native Architecture • 0 External Dependencies
            </div>
          </div>

          <Modal visible={confirm} onRequestClose={() => setConfirm(false)}>
            <div className="p-6 rounded-3xl bg-slate-900 border border-rose-500/50 text-center">
              <span className="text-4xl block mb-2">⚠️</span>
              <h3 className="text-xl font-black text-white mb-2">Confirm Reset</h3>
              <p className="text-xs text-slate-400 mb-6">Wipe all local points and stats? This cannot be undone.</p>
              <div className="flex space-x-3">
                <button type="button" onClick={() => setConfirm(false)} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold uppercase">Cancel</button>
                <button type="button" onClick={() => { onResetData(); setConfirm(false); }} className="flex-1 py-3 rounded-xl bg-rose-600 text-white font-black text-xs uppercase">Confirm</button>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    // ==========================================
    // DOCK NAVBAR
    // ==========================================
    function NavbarView({ currentScreen, onNavigate, t = {} }) {
      const items = [
        { id: 'home', label: t.navHome || 'Home', icon: '🏠' },
        { id: 'categories', label: t.navCategories || 'Categories', icon: '📚' },
        { id: 'game_modes', label: t.navModes || 'Modes', icon: '🎮' },
        { id: 'leaderboard', label: t.navLeaderboard || 'Ranks', icon: '🏆' },
        { id: 'profile', label: t.navProfile || 'Profile', icon: '👤' }
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#0a0e1c]/95 backdrop-blur-lg border-t border-slate-800/80 px-2 py-2 sm:py-3 shadow-2xl">
          <div className="max-w-xl mx-auto flex items-center justify-around">
            {items.map(item => {
              const active = currentScreen === item.id;
              return (
                <TouchableOpacity key={item.id} onPress={() => { sound.playClick(); onNavigate(item.id); }} className={`flex flex-col items-center py-1 px-3 rounded-xl transition-all ${active ? 'text-cyan-400 font-bold scale-105' : 'text-slate-400'}`}>
                  <span className="text-xl sm:text-2xl">{item.icon}</span>
                  <span className={`text-[11px] mt-0.5 ${active ? 'text-cyan-400 font-bold' : 'text-slate-400'}`}>{item.label}</span>
                </TouchableOpacity>
              );
            })}
          </div>
        </nav>
      );
    }

    // ==========================================
    // MODALS: DAILY REWARD & LEVEL UP
    // ==========================================
    function DailyRewardModal({ visible, streak, claimedToday, onClose, onClaim, lang = "uz", t = {} }) {
      const days = [
        { d: 1, p: '100 PTS', x: '50 XP', i: '🪙' },
        { d: 2, p: '150 PTS', x: '75 XP', i: '🪙' },
        { d: 3, p: '200 PTS', x: '100 XP', i: '💎' },
        { d: 4, p: '300 PTS', x: '150 XP', i: '💎' },
        { d: 5, p: '400 PTS', x: '200 XP', i: '⚡' },
        { d: 6, p: '500 PTS', x: '250 XP', i: '🔥' },
        { d: 7, p: '1,000 PTS', x: '500 XP', i: '👑' }
      ];
      const curIdx = ((streak - 1) % 7);

      return (
        <Modal visible={visible} onRequestClose={onClose}>
          <div className="p-6 rounded-3xl bg-slate-900 border border-slate-700 shadow-2xl text-center">
            <span className="text-4xl block mb-2">🎁</span>
            <h3 className="text-2xl font-black text-white">DAILY LOGIN REWARD</h3>
            <p className="text-xs text-slate-400 mb-6">Log in daily to claim escalating gold points & XP!</p>
            <div className="grid grid-cols-4 sm:grid-cols-7 gap-2 mb-6">
              {days.map((item, idx) => {
                const isCur = idx === curIdx;
                const isPast = idx < curIdx;
                return (
                  <div key={item.d} className={`p-2 rounded-xl border text-center ${isCur ? 'bg-purple-950 border-cyan-400 shadow scale-105' : isPast ? 'bg-slate-800/40 border-slate-800 opacity-60' : 'bg-slate-900 border-slate-800'}`}>
                    <span className="text-[10px] text-slate-400 block">D{item.d}</span>
                    <span className="text-lg block my-1">{item.i}</span>
                    <span className="text-[10px] font-black text-amber-300 block">{item.p}</span>
                  </div>
                );
              })}
            </div>
            <div className="flex space-x-3">
              <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold uppercase">Close</button>
              <button type="button" disabled={claimedToday} onClick={() => { sound.playLevelUp(); onClaim(); }} className={`flex-1 py-3 rounded-xl text-xs font-black uppercase ${claimedToday ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 shadow'}`}>
                {claimedToday ? 'Claimed ✓' : 'Claim Reward 🎁'}
              </button>
            </div>
          </div>
        </Modal>
      );
    }

    function LevelUpModal({ visible, level, onClose, lang = "uz", t = {} }) {
      const title = LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)] || 'Arena Legend';

      return (
        <Modal visible={visible} onRequestClose={onClose}>
          <div className="p-8 rounded-3xl bg-slate-900 border-2 border-cyan-400 shadow-2xl text-center">
            <span className="text-5xl block mb-2 animate-bounce">⭐</span>
            <span className="text-xs font-black uppercase text-cyan-300">{t.promotionAchieved || "Promotion Achieved!"}</span>
            <h2 className="text-3xl font-black text-white mt-1 mb-3">LEVEL UP!</h2>
            <div className="py-2 px-6 rounded-2xl bg-slate-950 border border-purple-500 inline-block mb-3">
              <span className="text-3xl font-black text-amber-300 font-mono">LEVEL {level}</span>
            </div>
            <p className="text-sm font-bold text-purple-300 mb-6">"{title}"</p>
            <button type="button" onClick={() => { sound.playClick(); onClose(); }} className="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-black text-xs uppercase shadow-lg">
              {t.claimAndContinue || "Claim & Continue ➔"}
            </button>
          </div>
        </Modal>
      );
    }

    // Mount Root React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
